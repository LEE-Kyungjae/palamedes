[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palamedes"
version = "0.6.0"
description = "A local, agent-friendly planning kernel with a thin Python SDK surface."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "LEE Kyungjae" },
]
keywords = ["planning", "agents", "startup", "product-strategy", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
palamedes = "palamedes:main"
palamedes-server = "palamedes_server:main"

[tool.setuptools]
py-modules = [
  "palamedes",
  "palamedes_agent",
  "palamedes_chat",
  "palamedes_client",
  "palamedes_conformance",
  "palamedes_cost_router",
  "palamedes_epistemics",
  "palamedes_gate_resolution",
  "palamedes_host_contract",
  "palamedes_knowledge",
  "palamedes_lifecycle",
  "palamedes_observe",
  "palamedes_observatory",
  "palamedes_architecture_transfer",
  "palamedes_cognition_v3",
  "palamedes_evidence_bundle",
  "palamedes_filelock",
  "palamedes_opportunity",
  "palamedes_invention",
  "palamedes_pursuit",
  "palamedes_workspace",
  "palamedes_proof",
  "palamedes_watch",
  "palamedes_server",
  "palamedes_satisfaction",
  "palamedes_store",
  "palamedes_storage",
  "palamedes_product_alignment",
  "palamedes_prompt",
  "palamedes_reference_intelligence",
  "palamedes_reference_adapter",
  "palamedes_reference_host",
  "palamedes_thought",
  "palamedes_vision",
  "palamedes_vision_scout",
  "palamedes_vision_benchmark",
]

[tool.setuptools.packages.find]
include = ["palamedes_sdk*", "palamedes_mission*"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["external_repos", "docs"]

[tool.ruff.lint]
# Start with the rules that catch defects rather than style: E9 is syntax and
# runtime breakage, F is pyflakes. Formatting rules are deliberately excluded
# because this codebase predates any formatter and reflowing it would bury real
# findings in diff noise.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The examples exist to show which names a host imports, so their imports are
# the point even when the snippet does not call them.
"examples/*" = ["F401"]
